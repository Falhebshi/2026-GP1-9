<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jaadah</title>
    <!-- Night mode: pick the theme before anything is drawn, so a dark-mode
         user never sees a white flash while React loads. Same rule as
         src/hooks/useTheme.js: saved choice first, then the system setting. -->
    <script>
      (function () {
        var theme
        try {
          theme = localStorage.getItem('jaadah-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
